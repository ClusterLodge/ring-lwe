[package]
name = "ring-lwe"
version = "0.1.7"
edition = "2021"
description = "Implements the ring learning-with-errors public key encrpytion scheme."
license = "MIT"
documentation = "https://docs.rs/ring-lwe"
homepage = "https://github.com/lattice-based-cryptography/ring-lwe"
repository = "https://github.com/lattice-based-cryptography/ring-lwe"

[dependencies]
polynomial-ring = "0.5.1"
num-traits = "=0.2.19"
rand = "0.9.2"
rand_distr = "0.5.1"
ntt = "0.1.9"
base64 = "0.21"
bincode = "1.3"
itertools = "0.14.0"
concrete-ntt = "0.2.0"
tfhe-ntt = "0.6.0"
modinverse = "0.1.1"
libdivide = "0.4.0"

[dev-dependencies]
criterion = "0.5.1"
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"

[features]
nightly = ["tfhe-ntt/nightly"]

[[bench]]
name = "benchmark_polymul"
path = "benches/benchmark_polymul.rs"
harness = false

[[bench]]
name = "benchmark_keygen"
path = "benches/benchmark_keygen.rs"
harness = false

[[bench]]
name = "benchmark_encrypt_decrypt"
path = "benches/benchmark_encrypt_decrypt.rs"
harness = false

[[bench]]
name = "benchmark_random"
path = "benches/benchmark_random.rs"
harness = false

[profile.bench]
debug = true
